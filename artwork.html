<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artwork Page</title>
    <link href="style.css" rel="stylesheet" type="text/css" media="all">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
</head>

<body>
    <!-- Header -->
    <div class="project-header">
        <!-- Name label word mark -->
        <div class="name-label">
            <p class="first-name">Aadi</p>
            <p class="last-name">Prashar</p>
        </div>

        <!-- Project Type -->
        <p class="project-type"><i class="bi bi-diamond-fill"></i>Artwork</p>
    </div>

    <div class="artwork-arc">
      <svg class="rings" aria-hidden="true">
        <circle class="ring" r="50%" />
      </svg>
    </div>

</body>

</html>
