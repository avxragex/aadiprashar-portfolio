<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artwork Page</title>
    <link href="style.css" rel="stylesheet" type="text/css" media="all">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <script src="js/projects.js" defer></script>
    <script src="js/updatePage.js" defer></script>
</head>

<body class="project-page">
    <!-- Header -->
    <div class="project-header">
        <!-- Name label word mark -->
        <a class="name-label" href="index.html">
            <p class="first-name">Aadi</p>
            <p class="last-name">Prashar</p>
        </a>

        <!-- Project Type -->
        <p class="project-type"><i class="bi bi-diamond-fill"></i>Artwork</p>
    </div>

    <!-- Arc Split -->
    <div class="artwork-arc">
      <svg class="rings" aria-hidden="true">
        <circle class="ring" r="50%" />
      </svg>
    </div>

    <!-- Artwork Content -->
    <div class="artwork-content">
        <p class="artwork-number" id="piece-number">Number 1</p>
        <h1 class="artwork-title" id="piece-title">Amethyst</h1>
        <div class="status" id="piece-status">Finished</div>

        <!-- Artwork data list -->
        <dl class="artwork-data">
            <div class="data-row">
                <dt>Type</dt>
                <dd>Artwork</dd>
            </div>
            <div class="data-row">
                <dt>Date</dt>
                <dd id="piece-date">01/07/2025</dd>
            </div>
            <div class="data-row">
                <dt>Time Taken</dt>
                <dd id="piece-time">4 Days</dd>
            </div>
            <div class="data-row">
                <dt>Made With</dt>
                <dd>Procreate</dd>
            </div>
        </dl>

        <p class="artwork-description" id="piece-description"></p>
        
        <!-- Buttons -->
        <div class="nav-buttons">
            <a class="button" id="piece-prev">Previous</a>
            <a class="button" id="piece-next">Next</a>
        </div>
        <a class="gold-button" href="index.html#orrery">Back to the Orrery</a>
    </div>

    <!-- Artwork -->
    <div class="artwork">
        <img id="piece-image" src="#" alt="#">
    </div>

</body>

</html>
